<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gustavo Löff — Barbeiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-light: #E2C97E;
      --black: #0D0D0D;
      --dark: #141414;
      --card: #1A1A1A;
      --text: #E8E0D0;
      --muted: #888;
    }

    html, body {
      min-height: 100vh;
      background: var(--black);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
    }

    /* grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 60px;
    }

    /* divider line */
    .rule {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      margin: 0 auto;
    }

    /* logo */
    .logo-wrap {
      margin-bottom: 8px;
    }
    .logo-wrap img {
      width: 160px;
      height: auto;
      display: block;
    }

    /* name block */
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--text);
      text-align: center;
      margin-top: 4px;
    }
    .title {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-top: 6px;
    }

    .rule-h {
      width: 80px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 28px auto;
    }

    /* link buttons */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 380px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      background: var(--card);
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      letter-spacing: 0.08em;
      transition: border-color 0.25s, background 0.25s;
    }
    .btn:hover {
      border-color: var(--gold);
      background: #1f1f1f;
    }
    .btn .icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #222;
      border: 1px solid #333;
    }
    .btn .icon svg {
      width: 18px;
      height: 18px;
      fill: var(--gold);
    }
    .btn .label {
      flex: 1;
    }
    .btn .label strong {
      display: block;
      font-weight: 500;
      font-size: 13px;
      color: var(--text);
    }
    .btn .label span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .btn .arrow {
      color: var(--gold);
      font-size: 16px;
      opacity: 0.6;
    }

    /* vcard download */
    .vcard-btn {
      margin-top: 10px;
      background: transparent;
      border: 1px solid var(--gold);
    }
    .vcard-btn:hover {
      background: rgba(201,168,76,0.08);
    }

    /* footer */
    footer {
      margin-top: 52px;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #444;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
